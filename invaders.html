<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Spooky Invaders 👾 - Alessio's World</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#141026">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #08070c;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }
    .game-container {
      width: 100%;
      height: 100%;
      max-width: 420px;
      padding: 6px 10px calc(10px + env(safe-area-inset-bottom, 0px)) 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .back-home-container {
      text-align: left;
      width: 100%;
      flex-shrink: 0;
    }
    .back-btn {
      background: #141026;
      border: 1.5px solid #38285c;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .halloween-title {
      font-size: 1.1rem;
      margin: 2px 0;
      text-align: center;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      flex-shrink: 0;
    }
    
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #141026;
      border: 1.5px solid #38285c;
      border-radius: 6px;
      padding: 4px 10px;
      flex-shrink: 0;
    }
    .hud-stat {
      text-align: center;
      display: flex;
      flex-direction: column;
    }
    .hud-stat label {
      font-size: 0.55rem;
      color: #a0a0ff;
      font-family: 'Roboto', sans-serif;
    }
    .hud-stat span {
      font-size: 0.8rem;
      color: #fff;
      font-weight: bold;
    }
    .gothic-btn-top {
      background: #ff7518;
      color: #141026;
      border: none;
      font-family: 'Creepster', cursive;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 2px 0;
      position: relative;
    }
    canvas#invaders-canvas {
      background-color: #0b0914;
      border: 2px solid #4a2875;
      border-radius: 6px;
      box-shadow: inset 0 0 10px #000;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
    }

    /* PANNELLO CONTROLLI RETRO ARCADE VINTAGE */
    .arcade-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      flex-shrink: 0;
      margin-top: 2px;
      height: 80px;
    }

    /* JOYSTICK VINTAGE PALLINA ROSSA */
    .joystick-base {
      width: 80px;
      height: 70px;
      background: #1c1533;
      border: 3px solid #38285c;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px #000, 0 4px 0 #0a0714;
      touch-action: none;
    }
    .joystick-stick {
      width: 12px;
      height: 35px;
      background: linear-gradient(90deg, #666, #ccc, #444);
      position: absolute;
      bottom: 25px;
      transform-origin: bottom center;
      border-radius: 3px;
      pointer-events: none;
    }
    .joystick-knob {
      width: 42px;
      height: 42px;
      background: radial-gradient(circle at 30% 30%, #ff5555, #cc0000 60%, #660000);
      border-radius: 50%;
      position: absolute;
      top: -12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset -2px -2px 6px rgba(0,0,0,0.5);
      cursor: pointer;
      pointer-events: none;
      transition: transform 0.05s linear;
    }

    /* PULSANTE RETRO SPARA */
    .arcade-fire-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .arcade-btn-fire {
      width: 65px;
      height: 65px;
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #cc0000 70%, #800000);
      border: 4px solid #141026;
      outline: 2px solid #ff7518;
      border-radius: 50%;
      box-shadow: 0 6px 0 #660000, 0 8px 12px rgba(0,0,0,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      text-shadow: 1px 1px 2px #000;
      touch-action: manipulation;
    }
    .arcade-btn-fire:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #660000, 0 4px 6px rgba(0,0,0,0.7);
      background: radial-gradient(circle at 35% 35%, #ff6666, #e60000 70%, #990000);
    }
    .btn-label {
      font-size: 0.6rem;
      color: #ff7518;
      font-family: 'Roboto', sans-serif;
      margin-top: 2px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- TRACCIA AUDIO -->
  <audio id="bg-music" loop preload="auto">
    <source src="spooky_invaders_ita.mp3" type="audio/mpeg">
  </audio>

  <div class="game-container">
    <div class="back-home-container">
      <a href="index.html" class="back-btn">⬅ TORNA ALLA HOME</a>
    </div>

    <h1 class="halloween-title">SPOOKY INVADERS 👾</h1>

    <div class="top-hud">
      <div class="hud-stat">
        <label>SCORE</label>
        <span id="score">0</span>
      </div>
      <div class="hud-stat">
        <label>WAVE</label>
        <span id="wave">1</span>
      </div>
      <div class="hud-stat">
        <label>LIVES</label>
        <span id="lives" style="font-size: 0.65rem;">🦇🦇🦇</span>
      </div>
      <button id="start-btn" class="gothic-btn-top">PLAY</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="invaders-canvas"></canvas>
    </div>

    <!-- PANNELLO CABINATO VINTAGE -->
    <div class="arcade-controls">
      <!-- JOYSTICK CON PALLINA ROSSA -->
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-stick" id="joystick-stick">
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>
      </div>

      <!-- BOTTONE ARCADE SPARO -->
      <div class="arcade-fire-container">
        <button class="arcade-btn-fire" id="btn-fire">🔥</button>
        <span class="btn-label">SPARA</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('invaders-canvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bg-music');

    const internalWidth = 360;
    const internalHeight = 440; 
    canvas.width = internalWidth;
    canvas.height = internalHeight;

    let score = 0;
    let wave = 1;
    let lives = 3;
    let isRunning = false;
    let animationId = null;

    let player = {
      w: 40,
      h: 28,
      x: internalWidth / 2 - 20,
      y: internalHeight - 35,
      speed: 6,
      fireRate: 220,
      lastShot: 0,
      tripleShot: false,
      shield: false
    };

    let leftPressed = false;
    let rightPressed = false;

    let bullets = [];
    let monsterBullets = [];
    let monsters = [];
    let powerUps = [];

    let monsterDirection = 1;
    let monsterBaseSpeed = 0.4;
    let totalMonstersInWave = 0;

    function initMonsters() {
      monsters = [];
      let rows = Math.min(5, 2 + Math.floor((wave + 1) / 2));
      let cols = Math.min(7, 4 + Math.floor(wave / 2));
      
      let spacingX = Math.floor(300 / cols);
      let spacingY = 28;
      let startX = (internalWidth - (cols * spacingX)) / 2;
      let startY = 35;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let health = 1;
          let icon = '🎃';
          
          if (r === 0 && wave >= 3) { health = 3; icon = '🦇'; }
          else if (r <= 1 && wave >= 2) { health = 2; icon = '👻'; }
          else { health = 1; icon = '🎃'; }

          monsters.push({
            x: startX + c * spacingX,
            y: startY + r * spacingY,
            w: 26,
            h: 22,
            health: health,
            maxHealth: health,
            icon: icon
          });
        }
      }
      
      totalMonstersInWave = monsters.length;
      monsterBaseSpeed = 0.35 + (wave * 0.08);
    }

    function drawPlayer() {
      ctx.save();
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      let playerSprite = player.shield ? '🛡️💀' : '💀🔫';
      ctx.fillText(playerSprite, player.x + player.w/2, player.y + player.h - 2);
      ctx.restore();
    }

    function drawMonsters() {
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      monsters.forEach(m => {
        ctx.fillText(m.icon, m.x + m.w/2, m.y + m.h - 2);
      });
    }

    function drawBullets() {
      ctx.fillStyle = '#ffaa00';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y, 4, 10);
      });

      ctx.fillStyle = '#ff4444';
      monsterBullets.forEach(mb => {
        ctx.beginPath();
        ctx.arc(mb.x, mb.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPowerUps() {
      powerUps.forEach(p => {
        ctx.save();
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.symbol, p.x, p.y);
        ctx.restore();
      });
    }

    function shoot() {
      if (!isRunning) return;
      let now = Date.now();
      if (now - player.lastShot > player.fireRate) {
        if (player.tripleShot) {
          bullets.push({ x: player.x + player.w/2 - 12, y: player.y, speedY: -8 });
          bullets.push({ x: player.x + player.w/2, y: player.y, speedY: -8 });
          bullets.push({ x: player.x + player.w/2 + 12, y: player.y, speedY: -8 });
        } else {
          bullets.push({ x: player.x + player.w/2, y: player.y, speedY: -8 });
        }
        player.lastShot = now;
      }
    }

    function update() {
      if (leftPressed) player.x -= player.speed;
      if (rightPressed) player.x += player.speed;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > internalWidth) player.x = internalWidth - player.w;

      bullets.forEach((b, index) => {
        b.y += b.speedY;
        if (b.y < 0) bullets.splice(index, 1);
      });

      let bulletSpeed = 2.2 + (wave * 0.15);
      monsterBullets.forEach((mb, index) => {
        mb.y += bulletSpeed;
        if (mb.y >= player.y && mb.x >= player.x && mb.x <= player.x + player.w) {
          monsterBullets.splice(index, 1);
          if (player.shield) {
            player.shield = false;
          } else {
            lives--;
            document.getElementById('lives').innerText = '🦇'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              bgMusic.pause();
              alert("Game Over! I mostri hanno invaso!");
              resetGame();
            }
          }
        } else if (mb.y > internalHeight) {
          monsterBullets.splice(index, 1);
        }
      });

      let reachEdge = false;
      let currentSpeed = monsterBaseSpeed * (1 + (totalMonstersInWave - monsters.length) * 0.02);

      monsters.forEach(m => {
        m.x += monsterDirection * currentSpeed;
        if (m.x + m.w >= internalWidth - 6 || m.x <= 6) {
          reachEdge = true;
        }

        let fireChance = 0.0003 + (wave * 0.0002);
        if (Math.random() < fireChance) {
          monsterBullets.push({ x: m.x + m.w/2, y: m.y + m.h });
        }
      });

      if (reachEdge) {
        monsterDirection *= -1;
        monsters.forEach(m => { m.y += 10; });
      }

      bullets.forEach((b, bIdx) => {
        monsters.forEach((m, mIdx) => {
          if (b.x > m.x && b.x < m.x + m.w && b.y > m.y && b.y < m.y + m.h) {
            bullets.splice(bIdx, 1);
            m.health--;
            
            if (m.health <= 0) {
              score += m.maxHealth * 20;
              document.getElementById('score').innerText = score;

              if (Math.random() < 0.28) {
                let items = [
                  { type: 'triple', symbol: '⚡' },
                  { type: 'fast', symbol: '🧪' },
                  { type: 'shield', symbol: '🛡️' },
                  { type: 'slow', symbol: '🕷️' },
                  { type: 'life', symbol: '🦇' }
                ];
                let chosen = items[Math.floor(Math.random() * items.length)];
                powerUps.push({ x: m.x + m.w/2, y: m.y, type: chosen.type, symbol: chosen.symbol });
              }

              monsters.splice(mIdx, 1);
            }
          }
        });
      });

      powerUps.forEach((p, index) => {
        p.y += 1.8;
        if (p.y >= player.y && p.x >= player.x && p.x <= player.x + player.w) {
          applyPowerUp(p.type);
          powerUps.splice(index, 1);
        } else if (p.y > internalHeight) {
          powerUps.splice(index, 1);
        }
      });

      if (monsters.length === 0) {
        wave++;
        document.getElementById('wave').innerText = wave;
        initMonsters();
        alert("Ondata superata! Preparati al Livello " + wave);
      }

      monsters.forEach(m => {
        if (m.y + m.h >= player.y) {
          bgMusic.pause();
          alert("I mostri sono atterrati! Game Over!");
          resetGame();
        }
      });
    }

    function applyPowerUp(type) {
      if (type === 'triple') {
        player.tripleShot = true;
        setTimeout(() => player.tripleShot = false, 8000);
      } else if (type === 'fast') {
        player.fireRate = 110;
        setTimeout(() => player.fireRate = 220, 8000);
      } else if (type === 'shield') {
        player.shield = true;
      } else if (type === 'slow') {
        player.speed = 3;
        setTimeout(() => player.speed = 6, 5000);
      } else if (type === 'life') {
        lives = Math.min(5, lives + 1);
        document.getElementById('lives').innerText = '🦇'.repeat(lives);
      }
    }

    function resetGame() {
      score = 0;
      wave = 1;
      lives = 3;
      player.tripleShot = false;
      player.shield = false;
      player.speed = 6;
      player.fireRate = 220;
      bullets = [];
      monsterBullets = [];
      powerUps = [];
      document.getElementById('score').innerText = score;
      document.getElementById('wave').innerText = wave;
      document.getElementById('lives').innerText = '🦇🦇🦇';
      initMonsters();
      isRunning = false;
      document.getElementById('start-btn').innerText = "PLAY";
    }

    function draw() {
      ctx.clearRect(0, 0, internalWidth, internalHeight);
      drawPlayer();
      drawMonsters();
      drawBullets();
      drawPowerUps();
    }

    function loop() {
      if (isRunning) {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
      }
    }

    // LOGICA JOYSTICK RETRO (PALLINA ROSSA)
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let joystickActive = false;

    function handleJoystickMove(clientX) {
      let rect = joyBase.getBoundingClientRect();
      let centerX = rect.left + rect.width / 2;
      let deltaX = clientX - centerX;
      let maxDistance = 25;

      // Limita il movimento della pallina
      deltaX = Math.max(-maxDistance, Math.min(maxDistance, deltaX));
      joyStick.style.transform = `rotate(${deltaX * 0.8}deg)`;

      if (deltaX < -6) {
        leftPressed = true;
        rightPressed = false;
      } else if (deltaX > 6) {
        rightPressed = true;
        leftPressed = false;
      } else {
        leftPressed = false;
        rightPressed = false;
      }
    }

    function resetJoystick() {
      joystickActive = false;
      leftPressed = false;
      rightPressed = false;
      joyStick.style.transform = `rotate(0deg)`;
    }

    joyBase.addEventListener('touchstart', (e) => {
      e.preventDefault();
      joystickActive = true;
      handleJoystickMove(e.touches[0].clientX);
    });

    joyBase.addEventListener('touchmove', (e) => {
      if (joystickActive) {
        e.preventDefault();
        handleJoystickMove(e.touches[0].clientX);
      }
    });

    joyBase.addEventListener('touchend', (e) => { e.preventDefault(); resetJoystick(); });
    joyBase.addEventListener('touchcancel', (e) => { e.preventDefault(); resetJoystick(); });

    // SUPPORTO MOUSE PER TESTING DA PC
    joyBase.addEventListener('mousedown', (e) => { joystickActive = true; handleJoystickMove(e.clientX); });
    window.addEventListener('mousemove', (e) => { if (joystickActive) handleJoystickMove(e.clientX); });
    window.addEventListener('mouseup', () => { if (joystickActive) resetJoystick(); });

    // PULSANTE SPARO
    const btnFire = document.getElementById('btn-fire');
    btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    btnFire.addEventListener('click', () => shoot());

    // TRASCINAMENTO DIRETTO SUL CANVAS
    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      let touchX = e.touches[0].clientX - rect.left;
      let scale = internalWidth / rect.width;
      player.x = (touchX * scale) - (player.w / 2);
    });

    // DOPPIO TOCCO PAUSA
    let lastTapTime = 0;
    canvas.addEventListener('touchstart', (e) => {
      let rect = canvas.getBoundingClientRect();
      let touchY = e.touches[0].clientY - rect.top;
      let currentTime = new Date().getTime();
      let tapLength = currentTime - lastTapTime;
      
      if (tapLength < 300 && tapLength > 0 && touchY < rect.height * 0.3) {
        e.preventDefault();
        togglePlayState();
      }
      lastTapTime = currentTime;
    });

    function playAudioSafe() {
      if (bgMusic.paused) {
        let p = bgMusic.play();
        if (p !== undefined) {
          p.catch(err => console.log("Audio in attesa di interazione:", err));
        }
      }
    }

    function togglePlayState() {
      if (!isRunning) {
        isRunning = true;
        playAudioSafe();
        document.getElementById('start-btn').innerText = "PAUSE";
        loop();
      } else {
        isRunning = false;
        bgMusic.pause();
        cancelAnimationFrame(animationId);
        document.getElementById('start-btn').innerText = "PLAY";
      }
    }

    document.getElementById('start-btn').onclick = togglePlayState;

    // RIFORZA LAYOUT MOBILE
    function forceResizeLayout() {
      window.scrollTo(0, 0);
      draw();
    }
    window.addEventListener('load', () => {
      setTimeout(forceResizeLayout, 100);
      setTimeout(forceResizeLayout, 300);
    });
    window.addEventListener('resize', forceResizeLayout);

    initMonsters();
    draw();
  </script>
</body>
</html>
