<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alessio's World 🎃 Halloween Arcade</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  
  <!-- CONFIGURAZIONE PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Halloween Games">
  
  <script>
    let deferredPrompt;

    // Cattura l'evento di installazione del browser
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      mostraPromptInstallazione();
    });

    function mostraPromptInstallazione() {
      if (document.getElementById('install-banner')) return;

      const banner = document.createElement('div');
      banner.id = 'install-banner';
      banner.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #141026;
        border: 2px solid #ff7518;
        color: #fff;
        padding: 12px 16px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-family: 'Roboto', sans-serif;
        max-width: 90%;
        text-align: center;
      `;

      banner.innerHTML = `
        <span style="font-size: 0.9rem; font-weight: bold; color: #ff7518;">🎃 Vuoi installare il gioco sul telefono?</span>
        <div style="display: flex; gap: 10px; width: 100%;">
          <button id="install-yes" style="flex: 1; background: #ff7518; color: #141026; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">Installa</button>
          <button id="install-no" style="flex: 1; background: #2a2244; color: #a0a0ff; border: 1px solid #5a3291; padding: 6px 12px; border-radius: 6px; cursor: pointer;">No</button>
        </div>
      `;

      document.body.appendChild(banner);

      document.getElementById('install-yes').onclick = async () => {
        banner.remove();
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`Risposta utente all'installazione: ${outcome}`);
          deferredPrompt = null;
        }
      };

      document.getElementById('install-no').onclick = () => {
        banner.remove();
      };
    }

    // Registrazione Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker registrato:', reg.scope))
          .catch((err) => console.log('Registrazione fallita:', err));
      });
    }
  </script>

  <style>
    /* Stili specifici per la Home di Benvenuto */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0b0914;
      font-family: 'Roboto', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    .home-container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    .world-title {
      font-family: 'Creepster', cursive;
      font-size: 3.5rem;
      color: #ff7518;
      text-shadow: 0 0 15px rgba(255, 117, 24, 0.6), 0 0 30px #000;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .world-subtitle {
      font-size: 1.1rem;
      color: #a0a0b0;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .game-card {
      background: #141026;
      border: 2px solid #38285c;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .game-card:hover {
      border-color: #ff7518;
      box-shadow: 0 0 20px rgba(255, 117, 24, 0.3);
      transform: translateY(-3px);
    }
    .game-info h2 {
      font-family: 'Creepster', cursive;
      font-size: 2rem;
      color: #ffb703;
      margin: 0 0 5px 0;
      letter-spacing: 1px;
      text-align: left;
    }
    .game-info p {
      font-size: 0.9rem;
      color: #8c889e;
      margin: 0;
      text-align: left;
    }
    .play-link-btn {
      background: linear-gradient(135deg, #ff7518, #e55a00);
      color: #fff;
      font-family: 'Creepster', cursive;
      font-size: 1.4rem;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(255, 117, 24,.4);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    .play-link-btn:hover {
      background: linear-gradient(135deg, #ff8c38, #ff7518);
      box-shadow: 0 0 15px rgba(255, 117, 24, 0.8);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="home-container">
    <h1 class="world-title">ALESSIO'S WORLD 🎃</h1>
    <p class="world-subtitle">Dark Arcade & Horror Games</p>

    <div class="games-grid">
      <!-- Card Tetris -->
      <div class="game-card">
        <div class="game-info">
          <h2>Halloween Tetris</h2>
          <p>Zucche, teschi e icone spettrali in caduta libera!</p>
        </div>
        <a href="tetris.html" class="play-link-btn">GIOCA</a>
      </div>

      <!-- Card Spooky Pac-Man -->
      <div class="game-card">
        <div class="game-info">
          <h2>Spooky Pac-Man</h2>
          <p>Raccogli candeline, fuggi dai mostri e mangia le zucche!</p>
        </div>
        <a href="pacman.html" class="play-link-btn">GIOCA</a>
      </div>
    </div>
  </div>

</body>
</html>
