<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alessio's World 🎃 Halloween Arcade</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Stili specifici per la Home di Benvenuto */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0b0914;
      font-family: 'Roboto', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    .home-container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    .world-title {
      font-family: 'Creepster', cursive;
      font-size: 3.5rem;
      color: #ff7518;
      text-shadow: 0 0 15px rgba(255, 117, 24, 0.6), 0 0 30px #000;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .world-subtitle {
      font-size: 1.1rem;
      color: #a0a0b0;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .game-card {
      background: #141026;
      border: 2px solid #38285c;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .game-card:hover {
      border-color: #ff7518;
      box-shadow: 0 0 20px rgba(255, 117, 24, 0.3);
      transform: translateY(-3px);
    }
    .game-info h2 {
      font-family: 'Creepster', cursive;
      font-size: 2rem;
      color: #ffb703;
      margin: 0 0 5px 0;
      letter-spacing: 1px;
      text-align: left;
    }
    .game-info p {
      font-size: 0.9rem;
      color: #8c889e;
      margin: 0;
      text-align: left;
    }
    .play-link-btn {
      background: linear-gradient(135deg, #ff7518, #e55a00);
      color: #fff;
      font-family: 'Creepster', cursive;
      font-size: 1.4rem;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(255, 117, 24,.4);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    .play-link-btn:hover {
      background: linear-gradient(135deg, #ff8c38, #ff7518);
      box-shadow: 0 0 15px rgba(255, 117, 24, 0.8);
      transform: scale(1.05);
    }
    .game-card.coming-soon {
      opacity: 0.6;
      border-color: #221a36;
    }
    .game-card.coming-soon:hover {
      border-color: #221a36;
      transform: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .coming-soon-badge {
      background: #2b1f45;
      color: #9d4edd;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 6px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="home-container">
    <h1 class="world-title">ALESSIO'S WORLD 🎃</h1>
    <p class="world-subtitle">Dark Arcade & Horror Games</p>

    <div class="games-grid">
      <!-- Card Tetris -->
      <div class="game-card">
        <div class="game-info">
          <h2>Halloween Tetris</h2>
          <p>Zucche, teschi e icone spettrali in caduta libera!</p>
        </div>
        <a href="tetris.html" class="play-link-btn">GIOCA</a>
      </div>

      <!-- Card Pacman (Coming Soon) -->
      <div class="game-card coming-soon">
        <div class="game-info">
          <h2>Spooky Pac-Man</h2>
          <p>Mangia i teschi e fuggi dai fantasmi nel labirinto.</p>
        </div>
        <span class="coming-soon-badge">IN ARRIVO 🦇</span>
      </div>
    </div>
  </div>

</body>
</html>
