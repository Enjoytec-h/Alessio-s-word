<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Halloween Tetris 🎃 - Alessio's World</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <!-- CONFIGURAZIONE PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Halloween Games">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker registrato:', reg.scope))
          .catch((err) => console.log('Registrazione fallita:', err));
      });
    }
  </script>
  <style>
    /* Stile per il pulsante di ritorno alla Home */
    .back-home-container {
      margin-bottom: 10px;
      text-align: left;
      width: 100%;
      max-width: 340px;
    }
    .back-btn {
      background: #141026;
      border: 2px solid #38285c;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      padding: 6px 15px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    .back-btn:hover {
      border-color: #ff7518;
      background: #221a36;
      color: #ffb703;
    }

    /* BARRA TOUCH ORIZZONTALE UNICA (Stile Joypad) */
    .touch-controls {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .touch-btn {
      flex: 1;
      height: 48px;
      background: linear-gradient(180deg, #2a2244 0%, #151026 100%);
      border: 2px solid #5a3291;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0a0714;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    .touch-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0a0714;
      background: #9d4edd;
      color: #fff;
    }
    .icon-btn {
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hand-icon {
      width: 80%;
      height: 80%;
      object-fit: contain;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div class="game-container">
    
    <!-- Pulsante per tornare alla Home -->
    <div class="back-home-container">
      <a href="index.html" class="back-btn">⬅ TORNA ALLA HOME</a>
    </div>

    <div class="logo-container">
      <h1 class="halloween-title">HALLOWEEN<br>TETRIS 🎃</h1>
    </div>

    <div class="main-layout">
      <!-- Area di gioco -->
      <canvas id="tetris" width="240" height="400"></canvas>

      <!-- Sidebar stile anteprima -->
      <div class="sidebar-panel">
        <div class="stat-box">
          <label>SCORE</label>
          <span id="score">0</span>
        </div>
        <div class="stat-box">
          <label>LEVEL</label>
          <span id="level">1</span>
        </div>
        <div class="stat-box">
          <label>LINES</label>
          <span id="lines">0</span>
        </div>
        <div class="stat-box next-box">
          <label>NEXT</label>
          <canvas id="next" width="80" height="80"></canvas>
        </div>

        <button id="start-btn" class="gothic-btn">PLAY / PAUSE</button>
      </div>
    </div>

    <!-- Controlli Touch Mobile in un'unica riga: Sinistra, Drop, Rotate, Destra -->
    <div class="touch-controls">
      <button class="touch-btn icon-btn" id="btn-left"><img src="sinistra.jpg" class="hand-icon" alt="Sinistra"></button>
      <button class="touch-btn" id="btn-drop">DROP</button>
      <button class="touch-btn" id="btn-rotate">ROTATE</button>
      <button class="touch-btn icon-btn" id="btn-right"><img src="destra.jpg" class="hand-icon" alt="Destra"></button>
    </div>
  </div>

  <audio id="bg-music" loop>
    <source src="Halloween_Tetris.mp3" type="audio/mpeg">
  </audio>
  
  <script src="tetris.js"></script>
</body>
</html>
