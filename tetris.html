<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Halloween Tetris 🎃 - Alessio's World</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Stile per il pulsante di ritorno alla Home */
    .back-home-container {
      margin-bottom: 10px;
      text-align: left;
      width: 100%;
      max-width: 340px;
    }
    .back-btn {
      background: #141026;
      border: 2px solid #38285c;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      padding: 6px 15px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    .back-btn:hover {
      border-color: #ff7518;
      background: #221a36;
      color: #ffb703;
    }
  </style>
</head>
<body>
  <div class="game-container">
    
    <!-- Pulsante per tornare alla Home -->
    <div class="back-home-container">
      <a href="index.html" class="back-btn">⬅ TORNA ALLA HOME</a>
    </div>

    <div class="logo-container">
      <h1 class="halloween-title">HALLOWEEN<br>TETRIS 🎃</h1>
    </div>

    <div class="main-layout">
      <!-- Area di gioco -->
      <canvas id="tetris" width="240" height="400"></canvas>

      <!-- Sidebar stile anteprima -->
      <div class="sidebar-panel">
        <div class="stat-box">
          <label>SCORE</label>
          <span id="score">0</span>
        </div>
        <div class="stat-box">
          <label>LEVEL</label>
          <span id="level">1</span>
        </div>
        <div class="stat-box">
          <label>LINES</label>
          <span id="lines">0</span>
        </div>
        <div class="stat-box next-box">
          <label>NEXT</label>
          <canvas id="next" width="80" height="80"></canvas>
        </div>

        <button id="start-btn" class="gothic-btn">PLAY / PAUSE</button>
      </div>
    </div>

 <!-- Controlli Touch Mobile -->
    <div class="touch-controls">
      <div class="touch-row">
        <button class="touch-btn icon-btn" id="btn-left"><img src="sinistra.jpg" class="hand-icon" alt="Sinistra"></button>
        <button class="touch-btn icon-btn" id="btn-right"><img src="destra.jpg" class="hand-icon" alt="Destra"></button>
        <button class="touch-btn" id="btn-rotate">🔄</button>
      </div>
      <div class="touch-row">
        <button class="touch-btn drop-btn" id="btn-drop">SPACE (DROP)</button>
      </div>
    </div>

  <audio id="bg-music" loop>
    <source src="Halloween_Tetris.mp3" type="audio/mpeg">
  </audio>
  
  <script src="tetris.js"></script>
</body>
</html>
