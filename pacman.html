<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spooky Pac-Man 🎃 - Alessio's World</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    .back-home-container {
      margin-bottom: 10px;
      text-align: left;
      width: 100%;
      max-width: 400px;
    }
    .back-btn {
      background: #141026;
      border: 2px solid #38285c;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      padding: 6px 15px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    canvas#pacman-canvas {
      background-color: #0b0914;
      border: 3px solid #4a2875;
      border-radius: 10px;
      box-shadow: inset 0 0 15px #000;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="back-home-container">
      <a href="index.html" class="back-btn">⬅ TORNA ALLA HOME</a>
    </div>

    <div class="logo-container">
      <h1 class="halloween-title">SPOOKY<br>PAC-MAN 🎃</h1>
    </div>

    <div class="main-layout">
      <canvas id="pacman-canvas" width="380" height="420"></canvas>

      <div class="sidebar-panel">
        <div class="stat-box">
          <label>SCORE</label>
          <span id="score">0</span>
        </div>
        <div class="stat-box">
          <label>LEVEL</label>
          <span id="level">1</span>
        </div>
        <div class="stat-box">
          <label>LIVES</label>
          <span id="lives">🦇🦇🦇</span>
        </div>
        <button id="start-pacman-btn" class="gothic-btn">PLAY / PAUSE</button>
      </div>
    </div>

    <!-- Controlli Touch Mobile -->
    <div class="touch-controls">
      <div class="touch-row">
        <button class="touch-btn" id="p-up">⬆️</button>
      </div>
      <div class="touch-row">
        <button class="touch-btn" id="p-left"><img src="sinistra.jpg" class="hand-icon" alt="Sinistra"></button>
        <button class="touch-btn" id="p-down">⬇️</button>
        <button class="touch-btn" id="p-right"><img src="destra.jpg" class="hand-icon" alt="Destra"></button>
      </div>
    </div>
  </div>

  <script>
    // Qui integreremo la logica del gioco (movimento mummia, candeline, zucche power-up e fantasmi scheletri/pipistrelli)
    const canvas = document.getElementById('pacman-canvas');
    const ctx = canvas.getContext('2d');
    
    // Test di visualizzazione iniziale
    ctx.fillStyle = '#ff7518';
    ctx.font = '20px Creepster';
    ctx.fillText("Premi Play per iniziare!", 80, 210);
  </script>
</body>
</html>
