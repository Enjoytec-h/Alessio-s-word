<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Spooky Breakout 🦇 - Alessio's World</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <!-- CONFIGURAZIONE PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Halloween Games">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker registrato:', reg.scope))
          .catch((err) => console.log('Registrazione fallita:', err));
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08070c;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-container {
      width: 100%;
      height: 100%;
      max-width: 420px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .back-home-container {
      text-align: left;
      width: 100%;
      flex-shrink: 0;
    }
    .back-btn {
      background: #141026;
      border: 2px solid #38285c;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .halloween-title {
      font-size: 1.2rem;
      margin: 2px 0;
      text-align: center;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      flex-shrink: 0;
    }
    
    /* Pannello statistiche e play in alto */
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #141026;
      border: 2px solid #38285c;
      border-radius: 6px;
      padding: 4px 10px;
      flex-shrink: 0;
    }
    .hud-stat {
      text-align: center;
      display: flex;
      flex-direction: column;
    }
    .hud-stat label {
      font-size: 0.55rem;
      color: #a0a0ff;
      font-family: 'Roboto', sans-serif;
    }
    .hud-stat span {
      font-size: 0.8rem;
      color: #fff;
      font-weight: bold;
    }
    .gothic-btn-top {
      background: #ff7518;
      color: #141026;
      border: none;
      font-family: 'Creepster', cursive;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Canvas dinamico flessibile */
    .canvas-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 2px 0;
      position: relative;
    }
    canvas#breakout-canvas {
      background-color: #0b0914;
      border: 2px solid #4a2875;
      border-radius: 6px;
      box-shadow: inset 0 0 10px #000;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
    }

    /* Popup Istruzioni / Doppio Tocco */
    #instructions-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 16, 38, 0.95);
      border: 2px solid #9d4edd;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      z-index: 10;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
      max-width: 300px;
      width: 90%;
    }
    #instructions-popup h2 {
      font-family: 'Creepster', cursive;
      color: #ff7518;
      font-size: 1.4rem;
      margin-top: 0;
    }
    #instructions-popup p {
      font-size: 0.85rem;
      color: #d8b4fe;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    #close-popup-btn {
      background: #ff7518;
      color: #141026;
      border: none;
      font-family: 'Creepster', cursive;
      font-size: 1rem;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Controlli Touch Inferiori compatti */
    .touch-controls {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-bottom: 4px;
    }
    .touch-btn {
      flex: 1;
      height: 46px;
      background: linear-gradient(180deg, #2a2244 0%, #151026 100%);
      border: 2px solid #5a3291;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0a0714;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      color: #ff7518;
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .touch-btn:active, .touch-btn.pressed {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0a0714;
      background: #9d4edd;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Popup Istruzioni -->
    <div id="instructions-popup">
      <h2>Istruzioni 🦇</h2>
      <p>Muovi la barra o trascina sul campo.<br><br><b>Doppio tocco rapido</b> per lanciare la palla o mettere in pausa!<br><br>Affronta i livelli crescenti e distruggi i mattoni corazzati!</p>
      <button id="close-popup-btn">HO CAPITO</button>
    </div>

    <div class="back-home-container">
      <a href="index.html" class="back-btn">⬅ TORNA ALLA HOME</a>
    </div>

    <h1 class="halloween-title">SPOOKY BREAKOUT 🦇</h1>

    <!-- HUD Superiore -->
    <div class="top-hud">
      <div class="hud-stat">
        <label>SCORE</label>
        <span id="score">0</span>
      </div>
      <div class="hud-stat">
        <label>LEVEL</label>
        <span id="level">1</span>
      </div>
      <div class="hud-stat">
        <label>LIVES</label>
        <span id="lives" style="font-size: 0.65rem;">🦇🦇🦇</span>
      </div>
      <button id="start-btn" class="gothic-btn-top">PLAY</button>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrapper">
      <canvas id="breakout-canvas"></canvas>
    </div>

    <!-- Controlli Touch laterali compatti -->
    <div class="touch-controls">
      <button class="touch-btn" id="btn-left">◀ SINISTRA</button>
      <button class="touch-btn" id="btn-right">DESTRA ▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('breakout-canvas');
    const ctx = canvas.getContext('2d');

    const internalWidth = 360;
    const internalHeight = 440; 
    canvas.width = internalWidth;
    canvas.height = internalHeight;

    let score = 0;
    let level = 1;
    let lives = 3;
    let isRunning = false;
    let animationId = null;

    let paddle = {
      w: 80,
      h: 14,
      x: internalWidth / 2 - 40,
      y: internalHeight - 25,
      speed: 7
    };

    let leftPressed = false;
    let rightPressed = false;

    let ball = {
      x: internalWidth / 2,
      y: internalHeight - 45,
      r: 6,
      speedX: 3,
      speedY: -3,
      active: false
    };

    let brickRowCount = 5;
    let brickColumnCount = 6;
    let brickWidth = 52;
    let brickHeight = 18; 
    let brickPadding = 6;
    let brickOffsetTop = 25;
    let brickOffsetLeft = 15;

    let bricks = [];

    // Generatore di livelli in stile Arkanoid
    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          let health = 1;

          // Schema variabile in base al livello corrente
          if (level === 1) {
            // Livello 1: standard (prime due file resistenti)
            health = (r === 0 || r === 1) ? 2 : 1;
          } else if (level === 2) {
            // Livello 2: schema a labirinto / alternato con mattoni corazzati da 3 colpi
            if (r === 0 && (c === 1 || c === 4)) health = 3;
            else if (r < 3) health = 2;
            else health = 1;
          } else {
            // Livello 3+: livelli più complessi e duri con presenza casuale di mattoni corazzati
            let rand = Math.random();
            if (level >= 4 && rand < 0.25) health = 3;
            else if (rand < 0.6) health = 2;
            else health = 1;

            // Crea spazi vuoti geometrici nei livelli avanzati per aumentare la sfida
            if ((r + c) % 5 === 0 && level >= 3) {
              health = 0; // Mattone assente (spazio vuoto)
            }
          }

          bricks[c][r] = {
            x: (c * (brickWidth + brickPadding)) + brickOffsetLeft,
            y: (r * (brickHeight + brickPadding)) + brickOffsetTop,
            status: health,
            maxHealth: health
          };
        }
      }
    }

    let powerUps = [];

    function resetPositions() {
      paddle.x = internalWidth / 2 - paddle.w / 2;
      paddle.w = 80;
      ball.x = internalWidth / 2;
      ball.y = paddle.y - 12;
      
      // Aumenta leggermente la velocità della palla all'aumentare dei livelli
      let baseSpeed = 3 + (level - 1) * 0.4;
      ball.speedX = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      ball.speedY = -baseSpeed;
      ball.active = false;
    }

    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status > 0) {
            // Colore e stile in base ai colpi rimanenti (resistenza)
            if (b.status === 3) {
              ctx.fillStyle = '#480ca8'; // Corazzato (3 colpi)
            } else if (b.status === 2) {
              ctx.fillStyle = '#9d4edd'; // Resistente (2 colpi)
            } else {
              ctx.fillStyle = '#ff7518'; // Normale (1 colpo)
            }

            ctx.fillRect(b.x, b.y, brickWidth, brickHeight);
            ctx.strokeStyle = '#38285c';
            ctx.strokeRect(b.x, b.y, brickWidth, brickHeight);

            // Icona interna al mattone
            ctx.fillStyle = '#0b0914';
            ctx.font = '9px Roboto';
            let icon = '🎃';
            if (b.status === 3) icon = '🪦';
            else if (b.status === 2) icon = '💀';
            
            ctx.fillText(icon, b.x + brickWidth / 2 - 6, b.y + 13);
          }
        }
      }
    }

    function drawPaddle() {
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);
    }

    function drawBall() {
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.closePath();
    }

    function drawPowerUps() {
      powerUps.forEach(p => {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        
        ctx.fillStyle = '#141026';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.lineWidth = 2;
        ctx.strokeStyle = p.color;
        ctx.stroke();
        ctx.restore();

        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.symbol, p.x, p.y + 1);
      });
    }

    function collisionDetection() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status > 0) {
            if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
              ball.speedY = -ball.speedY;
              b.status--;
              
              // Punteggio più alto per i mattoni più resistenti distrutti
              score += (b.maxHealth === 3 ? 30 : (b.maxHealth === 2 ? 20 : 10));
              document.getElementById('score').innerText = score;

              // Rilascio power-up con probabilità aumentata nei mattoni duri
              if (b.status === 0 && Math.random() < (0.3 + b.maxHealth * 0.1)) {
                let types = [
                  {type: 'expand', symbol: '👻', color: '#38b000', name: 'Fantasma Crescita'},
                  {type: 'shrink', symbol: '🕷️', color: '#ff0055', name: 'Ragno rimpicciolente'},
                  {type: 'slow', symbol: '🧪', color: '#00b4d8', name: 'Pozione Lenta'},
                  {type: 'fast', symbol: '⚡', color: '#faa307', name: 'Scossa Rapida'},
                  {type: 'life', symbol: '🦇', color: '#7209b7', name: 'Pipistrello Vita'}
                ];
                let chosen = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                  x: b.x + brickWidth / 2,
                  y: b.y + brickHeight,
                  dy: 2,
                  type: chosen.type,
                  symbol: chosen.symbol,
                  color: chosen.color
                });
              }

              checkWinCondition();
            }
          }
        }
      }
    }

    function checkWinCondition() {
      let won = true;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status > 0) won = false;
        }
      }
      if (won) {
        level++;
        document.getElementById('level').innerText = level;
        initBricks();
        resetPositions();
        alert("Complimenti! Livello superato. Inizia il Livello " + level);
      }
    }

    function update() {
      if (leftPressed) {
        paddle.x -= paddle.speed;
      } else if (rightPressed) {
        paddle.x += paddle.speed;
      }

      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.w > internalWidth) paddle.x = internalWidth - paddle.w;

      if (ball.active) {
        ball.x += ball.speedX;
        ball.y += ball.speedY;

        if (ball.x + ball.r > internalWidth || ball.x - ball.r < 0) {
          ball.speedX = -ball.speedX;
        }
        if (ball.y - ball.r < 0) {
          ball.speedY = -ball.speedY;
        }
        if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
          let hitPoint = ball.x - (paddle.x + paddle.w / 2);
          ball.speedX = hitPoint * 0.15;
          ball.speedY = -Math.abs(ball.speedY);
        }
        if (ball.y > internalHeight) {
          lives--;
          document.getElementById('lives').innerText = '🦇'.repeat(Math.max(0, lives));
          resetPositions();
          if (lives <= 0) {
            alert("Game Over! La pozione si è esaurita!");
            resetGame();
          }
        }
      } else {
        ball.x = paddle.x + paddle.w / 2;
      }

      powerUps.forEach((p, index) => {
        p.y += p.dy;
        if (p.y >= paddle.y && p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
          applyPowerUp(p.type);
          powerUps.splice(index, 1);
        } else if (p.y > internalHeight) {
          powerUps.splice(index, 1);
        }
      });

      collisionDetection();
    }

    function applyPowerUp(type) {
      if (type === 'expand') {
        paddle.w = Math.min(130, paddle.w + 25);
      } else if (type === 'shrink') {
        paddle.w = Math.max(45, paddle.w - 25);
      } else if (type === 'slow') {
        ball.speedX *= 0.8;
        ball.speedY *= 0.8;
      } else if (type === 'fast') {
        ball.speedX *= 1.25;
        ball.speedY *= 1.25;
      } else if (type === 'life') {
        lives = Math.min(5, lives + 1);
        document.getElementById('lives').innerText = '🦇'.repeat(lives);
      }
    }

    function resetGame() {
      score = 0;
      level = 1;
      lives = 3;
      document.getElementById('score').innerText = score;
      document.getElementById('level').innerText = level;
      document.getElementById('lives').innerText = '🦇🦇🦇';
      initBricks();
      resetPositions();
      isRunning = false;
      document.getElementById('start-btn').innerText = "PLAY";
    }

    function draw() {
      ctx.clearRect(0, 0, internalWidth, internalHeight);
      drawBricks();
      drawPaddle();
      drawBall();
      drawPowerUps();
    }

    function loop() {
      if (isRunning) {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
      }
    }

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; btnLeft.classList.add('pressed'); });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); leftPressed = false; btnLeft.classList.remove('pressed'); });
    btnLeft.addEventListener('mousedown', () => { leftPressed = true; btnLeft.classList.add('pressed'); });
    btnLeft.addEventListener('mouseup', () => { leftPressed = false; btnLeft.classList.remove('pressed'); });
    btnLeft.addEventListener('mouseleave', () => { leftPressed = false; btnLeft.classList.remove('pressed'); });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; btnRight.classList.add('pressed'); });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); rightPressed = false; btnRight.classList.remove('pressed'); });
    btnRight.addEventListener('mousedown', () => { rightPressed = true; btnRight.classList.add('pressed'); });
    btnRight.addEventListener('mouseup', () => { rightPressed = false; btnRight.classList.remove('pressed'); });
    btnRight.addEventListener('mouseleave', () => { rightPressed = false; btnRight.classList.remove('pressed'); });

    // Gestione Movimento touch e Rilevamento Doppio Tocco (Double Tap)
    let lastTapTime = 0;
    canvas.addEventListener('touchstart', (e) => {
      let currentTime = new Date().getTime();
      let tapLength = currentTime - lastTapTime;
      
      if (tapLength < 300 && tapLength > 0) {
        e.preventDefault();
        togglePlayState();
      }
      lastTapTime = currentTime;
    });

    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      let touchX = e.touches[0].clientX - rect.left;
      let scale = internalWidth / rect.width;
      paddle.x = (touchX * scale) - (paddle.w / 2);
    });

    function togglePlayState() {
      if (!isRunning) {
        isRunning = true;
        ball.active = true;
        document.getElementById('start-btn').innerText = "PAUSE";
        loop();
      } else {
        isRunning = false;
        cancelAnimationFrame(animationId);
        document.getElementById('start-btn').innerText = "PLAY";
      }
    }

    document.getElementById('start-btn').onclick = togglePlayState;

    // Chiusura del popup istruzioni
    document.getElementById('close-popup-btn').onclick = () => {
      document.getElementById('instructions-popup').style.display = 'none';
    };

    initBricks();
    resetPositions();
    draw();
  </script>
</body>
</html>
